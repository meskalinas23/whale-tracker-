name: Hyperliquid Whale Tracker

on:
  schedule:
    - cron: "15 * * * *"   # 15 min past every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Track whales
        run: python whale_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "whale-tracker-bot"
          git config user.email "whale-tracker-bot@users.noreply.github.com"
          git add docs/ whale_history.csv coin_exposure_history.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update whale tracker results"
          git push
