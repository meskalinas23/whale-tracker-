name: Robinhood Chain Whale Tracker

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Track Robinhood Chain whales
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: python robinhood_whales.py

      - name: Commit and push results
        run: |
          git config user.name "robinhood-tracker-bot"
          git config user.email "robinhood-tracker-bot@users.noreply.github.com"
          git add docs/robinhood.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Robinhood Chain whale results"
          git fetch origin main
          git merge -X ours origin/main --no-edit || true
          git push
